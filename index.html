<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
  <meta charset="UTF-8">

  <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

  <title>حجز موعد</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #f7f7f7;
      font-family: Arial, sans-serif;
      color: #222;
    }

    .container {
      width: 90%;
      max-width: 420px;
      background: white;
      padding: 40px 25px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    h1 {
      font-size: 26px;
      margin-bottom: 15px;
    }

    p {
      font-size: 17px;
      line-height: 1.7;
      color: #666;
      margin-bottom: 30px;
    }

    .whatsapp-btn {
      display: block;
      width: 100%;
      padding: 17px 20px;
      background: #25D366;
      color: white;
      text-decoration: none;
      border-radius: 10px;
      font-size: 19px;
      font-weight: bold;
      cursor: pointer;
      border: none;
    }

    .whatsapp-btn:active {
      transform: scale(0.98);
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>احجز موعدك مع الدكتور</h1>

    <p>
      للحجز والاستفسار، اضغط على الزر للانتقال إلى واتساب العيادة.
    </p>

    <a
      id="whatsappButton"
      class="whatsapp-btn"
      href="#"
      target="_blank"
      rel="noopener"
    >
      فتح واتساب
    </a>

  </div>

  <script>

    const trackingURL =
      "https://script.google.com/macros/s/AKfycbxUCxvufja1OlHtMTthm9aetpZXoHMJeGuJ3Njxiiire3hTwVc-m-qltjvKWsgZldE0/exec";

    const whatsappNumber = "201100054391";

    const params = new URLSearchParams(window.location.search);

    // لو اللينك فيه source نستخدمه
    // لو مفيش source نعتبره Instagram
    const source = params.get("source") || "Instagram";

    const campaign = params.get("campaign") || "Bookings";

    const medium = params.get("medium") || "Bio";

    const whatsappMessage =
      source === "TikTok"
        ? "مرحبًا، وصلت إليكم من تيك توك وأرغب في حجز موعد."
        : "مرحبًا، وصلت إليكم من إنستجرام وأرغب في حجز موعد.";

    const whatsappURL =
      "https://api.whatsapp.com/send?phone=" +
      whatsappNumber +
      "&text=" +
      encodeURIComponent(whatsappMessage);

    const button =
      document.getElementById("whatsappButton");

    button.href = whatsappURL;

    let tracked = false;

    button.addEventListener("click", function () {

      if (tracked) {
        return;
      }

      tracked = true;

      const url =
        trackingURL +
        "?action=whatsapp_click" +
        "&source=" + encodeURIComponent(source) +
        "&campaign=" + encodeURIComponent(campaign) +
        "&medium=" + encodeURIComponent(medium);

      const img = new Image();
      img.src = url;

    });

  </script>

</body>

</html>
